<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}.sw{flex:1 1 60px;min-width:56px}.sw div{height:44px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw span{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:4px}.row{display:flex;gap:8px;width:100%}.lab{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:auto;align-self:center}</style></head><body><div class="sw"><div style="background:var(--green-100)"></div><span>green-100</span></div><div class="sw"><div style="background:var(--green-500)"></div><span>green-500</span></div><div class="sw"><div style="background:var(--green-700)"></div><span>green-700</span></div><div class="sw"><div style="background:var(--red-100)"></div><span>red-100</span></div><div class="sw"><div style="background:var(--red-500)"></div><span>red-500</span></div><div class="sw"><div style="background:var(--red-700)"></div><span>red-700</span></div><div class="sw"><div style="background:var(--blue-100)"></div><span>blue-100</span></div><div class="sw"><div style="background:var(--blue-500)"></div><span>blue-500</span></div><div class="sw"><div style="background:var(--blue-700)"></div><span>blue-700</span></div></body></html>
