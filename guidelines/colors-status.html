<!-- @dsCard group="Colors" viewport="700x120" name="Booking status" subtitle="Calendar and contract states" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}.sw{flex:1 1 60px;min-width:56px}.sw div{height:44px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw span{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:4px}.row{display:flex;gap:8px;width:100%}.lab{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:auto;align-self:center}</style></head><body><div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border-default);border-radius:4px;flex:1"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-active)"></span><span style="font-weight:600">Aktive</span><span class="lab">--status-active</span></div><div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border-default);border-radius:4px;flex:1"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-reserved)"></span><span style="font-weight:600">Rezervuar</span><span class="lab">--status-reserved</span></div><div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border-default);border-radius:4px;flex:1"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-overdue)"></span><span style="font-weight:600">Vonesë</span><span class="lab">--status-overdue</span></div><div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border-default);border-radius:4px;flex:1"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-done)"></span><span style="font-weight:600">Mbyllur</span><span class="lab">--status-done</span></div></body></html>
