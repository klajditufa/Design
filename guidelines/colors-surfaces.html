<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}.sw{flex:1 1 60px;min-width:56px}.sw div{height:44px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw span{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:4px}.row{display:flex;gap:8px;width:100%}.lab{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:auto;align-self:center}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%"><div style="background:var(--surface-page);border:1px solid var(--border-default);padding:12px;border-radius:4px"><b>surface-page</b><div style="color:var(--text-muted);font-size:13px">text-muted</div></div><div style="background:var(--surface-card);border:1px solid var(--border-default);padding:12px;border-radius:4px;box-shadow:var(--shadow-sm)"><b>surface-card</b><div style="color:var(--text-subtle);font-size:13px">text-subtle</div></div><div style="background:var(--surface-sidebar);color:var(--text-on-dark);padding:12px;border-radius:4px"><b>surface-sidebar</b><div style="color:var(--text-on-dark-muted);font-size:13px">text-on-dark-muted</div></div></div></body></html>
