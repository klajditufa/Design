<!-- @dsCard group="Effects" viewport="700x110" name="Focus ring & borders" subtitle="--ring-focus on inputs; 1px --border-default, --border-strong on hover" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}.sw{flex:1 1 60px;min-width:56px}.sw div{height:44px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw span{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:4px}.row{display:flex;gap:8px;width:100%}.lab{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:auto;align-self:center}</style></head><body><div style="height:38px;flex:1;border:1px solid var(--border-default);border-radius:4px;padding:0 12px;display:flex;align-items:center;font-size:14px;color:var(--text-subtle)">default</div><div style="height:38px;flex:1;border:1px solid var(--border-strong);border-radius:4px;padding:0 12px;display:flex;align-items:center;font-size:14px;color:var(--text-subtle)">hover</div><div style="height:38px;flex:1;border:1px solid var(--border-focus);box-shadow:var(--ring-focus);border-radius:4px;padding:0 12px;display:flex;align-items:center;font-size:14px">focus</div></body></html>
