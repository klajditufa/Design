<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}.sw{flex:1 1 60px;min-width:56px}.sw div{height:44px;border-radius:var(--radius-md);border:1px solid var(--border-default)}.sw span{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:4px}.row{display:flex;gap:8px;width:100%}.lab{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:auto;align-self:center}</style></head><body><div style="flex:1;height:72px;background:#fff;border-radius:4px;box-shadow:var(--shadow-xs);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">shadow-xs</div><div style="flex:1;height:72px;background:#fff;border-radius:4px;box-shadow:var(--shadow-sm);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">shadow-sm</div><div style="flex:1;height:72px;background:#fff;border-radius:4px;box-shadow:var(--shadow-md);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">shadow-md</div><div style="flex:1;height:72px;background:#fff;border-radius:4px;box-shadow:var(--shadow-lg);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">shadow-lg</div></body></html>
